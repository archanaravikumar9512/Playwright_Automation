<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quality-first demo application</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 48px auto;
        padding: 0 20px;
        line-height: 1.5;
      }
      nav {
        display: flex;
        gap: 16px;
        margin-bottom: 32px;
      }
      form {
        display: flex;
        gap: 8px;
        margin: 24px 0;
      }
      input,
      button {
        padding: 10px 12px;
        font: inherit;
      }
      li {
        margin: 8px 0;
      }
      a {
        color: #0645ad;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/login.html">Sign in</a>
    </nav>
    <main>
      <h1>Quality-first demo application</h1>
      <p>Deterministic local application used by the automation starter.</p>
      <form id="search-form">
        <label for="search">Search products</label>
        <input id="search" name="search" placeholder="e.g. Notebook" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <ul id="results" data-testid="search-results" aria-label="Search results"></ul>
    </main>
    <script>
      const products = ['Notebook', 'Keyboard', 'Monitor'];
      const form = document.querySelector('#search-form');
      const input = document.querySelector('#search');
      const results = document.querySelector('#results');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        results.replaceChildren();
        products
          .filter((product) => product.toLowerCase().includes(input.value.toLowerCase()))
          .forEach((product) => {
            const item = document.createElement('li');
            item.textContent = product;
            results.appendChild(item);
          });
      });
    </script>
  </body>
</html>
